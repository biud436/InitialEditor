[package]
name = "initial-editor"
version = "2.0.0"
description = "InitialEditor 데스크톱 셸 (Tauri 2). 명령 표는 docs/plans/01-tech-stack.md 6절"
authors = ["biud436 <biud436@gmail.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "initial_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
thiserror = "2"
base64 = "0.22"
percent-encoding = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
